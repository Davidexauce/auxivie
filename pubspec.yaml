name: auxivie
description: Plateforme de mise en relation entre professionnels de l'aide à domicile et familles
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  provider: ^6.1.1
  
  # Base de données locale
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # API & Réseau
  http: ^1.2.0
  shared_preferences: ^2.2.2
  
  # Paiements
  flutter_stripe: ^11.1.0
  
  # UI & Utilitaires
  intl: ^0.18.1
  table_calendar: ^3.0.9
  image_picker: ^1.0.4
  url_launcher: ^6.3.0
  
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/colors.json

  # ⚡ Désactiver LLDB pour iPhone réel
  config:
    enable-lldb-debugging: false

# Configuration pour générer les icônes de l'application
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
  min_sdk_android: 21


name: aidalya
description: Aidalya — plateforme de mise en relation entre professionnels de l'aide à domicile et familles
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  provider: ^6.1.1
  
  # API & Réseau
  http: ^1.6.0
  http_parser: ^4.1.2
  shared_preferences: ^2.5.5
  
  # Paiements
  flutter_stripe: ^12.6.0
  
  # UI & Utilitaires
  intl: ^0.20.2
  table_calendar: ^3.2.0
  image_picker: ^1.2.1
  file_picker: ^11.0.2
  flutter_svg: ^2.2.0
  url_launcher: ^6.3.0
  
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/legal/
    - assets/colors.json

  # ⚡ Désactiver LLDB pour iPhone réel
  config:
    enable-lldb-debugging: false

# Configuration pour générer les icônes de l'application
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_1024.png"
  remove_alpha_ios: false
  min_sdk_android: 21

